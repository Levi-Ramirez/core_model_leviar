[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "core-model-leviar"
version = "0.1.0"
description = "Build a rotation-corrected 3D model of your abdominal/pelvic anatomy across a history of CT scans, using TotalSegmentator segmentations as input."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "nibabel>=4.0",
    "scikit-image>=0.21",
    "TotalSegmentator==2.18.0",
    "pydicom>=3.0",
    "dicom2nifti>=2.6.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-socket>=0.7"]

[project.scripts]
core-model = "core_model.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-m "not integration" --strict-markers --disable-socket'
required_plugins = ["pytest-socket>=0.7"]
markers = [
    "integration: opt-in tests using a locally supplied scan and real inference",
]
